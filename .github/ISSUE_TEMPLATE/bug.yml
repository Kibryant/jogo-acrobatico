name: Relatar um problema
description: Algo no jogo, nas ferramentas ou no CI não funciona como deveria. (Report a bug; Portuguese preferred.)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar! Falha de segurança não vem aqui: veja o `SECURITY.md`. Perguntas e ideias vão para o Discussions.
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: Descreva o problema. Se der, junte um print ou um vídeo curto.
    validations:
      required: true
  - type: textarea
    id: como-reproduzir
    attributes:
      label: Como reproduzir
      description: Os passos, um por linha, a partir de um clone limpo ou do jogo aberto.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: o-que-esperava
    attributes:
      label: O que você esperava?
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão ou commit
      description: A versão do jogo ou o hash do commit (`git rev-parse --short HEAD`).
  - type: input
    id: maquina
    attributes:
      label: Sistema e máquina
      placeholder: Windows 11, Ryzen 3 PRO 3200G, Radeon RX 550
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: A saída do terminal, do portão ou do jogo. Vira um bloco de código sozinho.
      render: shell
